services:
  faust-rokuremote:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faust-rokuremote
    restart: unless-stopped
    # When deployed on the same local network / VLAN as your Roku TV:
    # network_mode: host allows direct access to local subnets for 1-second auto-discovery & SSDP multicast.
    network_mode: host
    environment:
      - PORT=4000
      - NODE_ENV=production
    # Persist saved web app bookmarks across container updates
    volumes:
      - ./data:/app/data
